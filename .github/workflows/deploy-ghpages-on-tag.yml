name: Publicar GitHub Pages mediante etiquetas

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener la versión etiquetada
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Preparar los archivos públicos
        run: |
          mkdir _site
          cp index.html style.css mediaqueries.css script.js _site/
          cp -R assets _site/assets
      - name: Cargar el artefacto del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v5
